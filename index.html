<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Carousel</title>

<style>
/* Prevent layout expansion */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent !important; /* removed white */
  overflow-x: hidden; /* prevent scrollbars */
  font-family: sans-serif;
}

.carousel {
  position: relative;
  width: 100%;
  overflow: hidden; /* contain animation */
  padding: 1rem 0;
  background: transparent;
}

/* KEY FIX: inline-flex prevents width expansion */
.carousel-track {
  display: inline-flex;
  gap: 4rem;
  animation: scroll 40s linear infinite;
  white-space: nowrap;
  will-change: transform;
}

.carousel-track img {
  height: 60px;
  flex-shrink: 0;
  transition: transform 0.3s ease;
  opacity: 0.6;
}

.carousel-track img:hover {
  transform: scale(1.3);
  z-index: 3;
  opacity: 1;
}

/* Transparent fade edges (no white background) */
.carousel::before,
.carousel::after {
  content: "";
  position: absolute;
  top: 0;
  width: 100px;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}

.carousel::before {
  left: 0;
  background: linear-gradient(to right, rgba(255,255,255,0.8), transparent);
}

.carousel::after {
  right: 0;
  background: linear-gradient(to left, rgba(255,255,255,0.8), transparent);
}

@keyframes scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
</style>
</head>

<body>

<div class="carousel">
  <div class="carousel-track">

    <!-- First set -->
    <img src="/creatorlist/github-icons/jasontomlee-icon-4x.png" alt="Jasontomlee Icon1">
    <img src="/creatorlist/github-icons/unknown-icon v2-4x.png" alt="Unknown Icon2">
    <img src="/creatorlist/github-icons/unknown-icon v2-4x.png" alt="Unknown Icon3">
    <img src="/creatorlist/github-icons/unknown-icon v2-4x.png" alt="Unknown Icon4">
    <img src="/creatorlist/github-icons/unknown-icon v2-4x.png" alt="Unknown Icon5">

    <!-- Duplicate for seamless loop -->
    <img src="/creatorlist/github-icons/jasontomlee-icon-4x.png" alt="Jasontomlee Icon6">
    <img src="/creatorlist/github-icons/unknown-icon v2-4x.png" alt="Unknown Icon7">
    <img src="/creatorlist/github-icons/unknown-icon v2-4x.png" alt="Unknown Icon8">
    <img src="/creatorlist/github-icons/unknown-icon v2-4x.png" alt="Unknown Icon9">
    <img src="/creatorlist/github-icons/unknown-icon v2-4x.png" alt="Unknown Icon10">

  </div>
</div>

</body>
</html>
